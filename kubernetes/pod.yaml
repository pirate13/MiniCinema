apiVersion: v1
kind: Pod
metadata:
  name: shared-logs
spec:
  containers:
    - name: writer
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            date >> /logs/app.log
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /logs

    - name: reader
      image: busybox
      command: ["/bin/sh", "-c"]
      args:
        - |
          touch /logs/app.log
          tail -f /logs/app.log
      volumeMounts:
        - name: shared-data
          mountPath: /logs

  volumes:
    - name: shared-data
      emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minicinema-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minicinema-api
  template:
    metadata:
      labels:
        app: minicinema-api
    spec:
      containers:
        - name: api
          image: minicinema-api:lab2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://cinema:cinema_dev_password@postgres:5432/cinema

---
apiVersion: v1
kind: Service
metadata:
  name: minicinema-api
spec:
  type: NodePort
  selector:
    app: minicinema-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080